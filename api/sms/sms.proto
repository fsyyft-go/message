syntax = "proto3";

package api.sms;

import "google/api/annotations.proto";
import "validate/validate.proto";

option go_package = "github.com/fsyyft-go/sms-bridge/api/sms;sms";

message SendSmsRequest {
  string from = 1 [(validate.rules).string = { pattern: "^1[3-9]\\d{9}$" }];
  string to = 2 [(validate.rules).string = { pattern: "^1[3-9]\\d{9}$" }];
  string message = 3 [(validate.rules).string = { max_len: 5120 }];
}

message SendSmsResponse {
  string message_id = 1;
}

message ListSmsRequest {
}

message SmsInfo {
  string from = 1;
  string to = 2;
  string message = 3;
  string message_id = 4;
  string created_at = 5;
}

message ListSmsResponse {
  repeated SmsInfo sms = 1;
}

service SmsService {
  rpc SendSms(SendSmsRequest) returns (SendSmsResponse) {
    option (google.api.http) = {
      get: "sms/bridge"
      additional_bindings{
        get: "sms/bridge/?from={from}&to={to}&message={message}"
      }
    };
  }

  rpc ListSms(ListSmsRequest) returns (ListSmsResponse) {
    option (google.api.http) = {
      get: "sms/list"
    };
  }

}