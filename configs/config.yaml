# HTTP 服务器配置。
http:
  addr: 0.0.0.0 # 监听地址，0.0.0.0 表示监听所有网络接口。
  port: 8098 # 监听端口。
  basicauth: # BasicAuth 认证配置。
    enabled: true # 是否启用基本认证。
    realm: SMS Bridge Admin # 认证域，显示在浏览器认证对话框中。
    credentials: # 基本认证用户列表。
      - username: admin # 用户名。
        password.des: 22610DC7155E7283 # 密码。
      - username: user # 用户名。
        password.des: 460C506A5F924446 # 密码。

# 日志配置。
log:
  type: logrus # 日志类型，使用 logrus 日志库。
  output: logs/message.log # 日志输出路径。
  level: debug # 日志级别，可选值：debug、info、warn、error。

# 短信服务配置。
sms:
  cache:
    interval: 60 # 清理过期记录的间隔时间（秒）。
    time: 3600 # 记录过期时间（秒），超过此时间的记录将被清理。
