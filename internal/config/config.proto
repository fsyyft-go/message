syntax = "proto3";

package internal.config;

option go_package = "github.com/fsyyft-go/sms-bridge/internal/config;config";

import "google/protobuf/duration.proto";

message Config {
    HTTP http = 1;
    Log log = 2;
}

message HTTP {
    string addr = 1;
    int32 port = 2;
}

message Log {
    string type = 1;
    string output = 2;
    string level = 3;
}